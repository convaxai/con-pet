name: Package installers

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.workflow_run.event || github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: dmg
            artifact: con-pet-macos-universal
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: con-pet-windows-x64
            path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          credentials=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_ID"
            "$APPLE_PASSWORD"
            "$APPLE_TEAM_ID"
            "$KEYCHAIN_PASSWORD"
          )
          configured=0
          for credential in "${credentials[@]}"; do
            if [[ -n "$credential" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'MACOS_SIGNING_MODE=adhoc' >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$configured" -ne "${#credentials[@]}" ]]; then
            echo 'All Apple signing and notarization secrets must be configured together.' >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/con-pet-signing.p12"
          keychain_path="$RUNNER_TEMP/con-pet-signing.keychain-db"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path" 2>/dev/null; then
            printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

          signing_identity="$({ security find-identity -v -p codesigning "$keychain_path" || true; } \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -n 1)"
          if [[ -z "$signing_identity" ]]; then
            echo 'No Developer ID Application identity was found in the supplied certificate.' >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo 'MACOS_SIGNING_MODE=developer-id' >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Record macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build-metadata
          printf '%s\n' "$MACOS_SIGNING_MODE" > build-metadata/macos-signing-mode.txt

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload macOS signing metadata
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: con-pet-macos-signing-${{ github.event.workflow_run.head_sha || github.sha }}
          path: build-metadata/macos-signing-mode.txt
          if-no-files-found: error
          retention-days: 30

  publish-nightly:
    name: Publish nightly releases
    needs: package
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: con-pet-*
          path: release
          merge-multiple: true

      - name: Prepare stable download names and checksums
        shell: bash
        run: |
          set -euo pipefail

          mac_dmg="$(find release -type f -name '*.dmg' -print -quit)"
          windows_exe="$(find release -type f -name '*.exe' -print -quit)"
          test -n "$mac_dmg"
          test -n "$windows_exe"

          mv "$mac_dmg" release/Con-Pet-macOS-universal.dmg
          mv "$windows_exe" release/Con-Pet-Windows-x64.exe

          signing_mode="$(cat release/macos-signing-mode.txt)"
          [[ "$signing_mode" = 'adhoc' || "$signing_mode" = 'developer-id' ]]
          echo "MACOS_SIGNING_MODE=$signing_mode" >> "$GITHUB_ENV"
          rm release/macos-signing-mode.txt

          cd release
          sha256sum Con-Pet-macOS-universal.dmg Con-Pet-Windows-x64.exe > SHA256SUMS.txt

      - name: Publish the single rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          short_sha="${TARGET_SHA:0:12}"
          release_tag=nightly
          if [[ "$MACOS_SIGNING_MODE" = 'developer-id' ]]; then
            signature_note='The macOS build is Developer ID signed and notarized.'
          else
            signature_note='The macOS build is ad-hoc signed. Input Monitoring permission may need to be granted again after an update.'
          fi

          printf -v release_notes '**This is the only current Nightly build.** Older `nightly-*` releases are archived; build history remains available as Actions artifacts.\n\n- Commit: [`%s`](https://github.com/%s/commit/%s)\n- Package run: [#%s](https://github.com/%s/actions/runs/%s)\n- %s\n\nmacOS may require Open Anyway; Windows may show a SmartScreen warning.' \
            "$short_sha" "$GITHUB_REPOSITORY" "$TARGET_SHA" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$signature_note"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
              -f sha="${TARGET_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${release_tag}" -f sha="${TARGET_SHA}" >/dev/null
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --title "Con Pet Nightly ${short_sha}" \
              --notes "$release_notes" \
              --prerelease=false \
              --latest
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Con Pet Nightly ${short_sha}" \
              --notes "$release_notes" \
              --latest
          fi

          gh release upload "$release_tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
